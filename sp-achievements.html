<!DOCTYPE html>
<html>
    <head>
        <title>Achievements</title>
        <link href="sp-styles.css" type="text/css" rel="stylesheet">
        <script>
            async function fetchAchievements() {
                console.log('Fetching achievement data...');
                
                // Retrieve the logged-in player ID from sessionStorage
                const playerID = sessionStorage.getItem('loggedInID');
                
                if (!playerID) {
                    console.error('Player ID not found. User may not be logged in.');
                    return;
                }

                let query = `SELECT a.achievement_name, a.achievement_desc, a.achievement_image, 
                             IFNULL(pa.is_locked, TRUE) AS is_locked
                             FROM achievements a
                             LEFT JOIN player_achievements pa ON a.achievement_id = pa.achievement_id 
                             AND pa.player_id = ${playerID}
                             ORDER BY a.achievement_id DESC`;

                let formData = new FormData();
                formData.append('hostname', 'localhost');
                formData.append('username', 'jrice27');
                formData.append('password', 'rZk8FVrXNllcPl8Y');
                formData.append('database', 'CSC1034_CW_13');
                formData.append('query', query);
                
                try {
                    let response = await fetch('https://jrice27.webhosting1.eeecs.qub.ac.uk/dbConnector.php', {
                        method: 'POST',
                        body: formData
                    });
                    
                    let result = await response.json();
                    
                    if (result.error) {
                        console.error(result.error.toString());
                        return;
                    }
                    
                    const tableBody = document.querySelector('#achievements tbody');
                    tableBody.innerHTML = ''; // Clear existing data
                    
                    result.data.forEach(achievement => {
                        let row = document.createElement('tr');
                        // Check if the achievement is unlocked
                        let locked = achievement.is_locked;

                        row.innerHTML = `
                            <td>${achievement.achievement_name}</td>
                            <td>${achievement.achievement_desc}</td>
                            <td>
                                <img src="${achievement.achievement_image}" alt="${achievement.achievement_name}" width="50" height="50" class="${locked ? 'locked' : ''}">
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                    
                    console.log('Achievements updated successfully.');
                } catch (error) {
                    console.error('Error fetching achievement data:', error);
                }
            }
            
            window.onload = fetchAchievements;
        </script>
    </head>
    <body>
        <h1>Achievements</h1>
        <table id="achievements">
            <tbody>
                <!-- Data will be populated here -->
            </tbody>
        </table>

        <nav>
            <a href="sp-gamehub.html">Back to Main Menu</a>
        </nav>

        <div class="bezel-overlay"></div>
    </body>
</html>
