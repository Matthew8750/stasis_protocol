<!DOCTYPE html>
<html> 
    <head>
        <title>Stasis Protocol</title>
        <link rel="icon" href="favicon.ico" type="images\icon_Player.png">
        <link href="sp-styles.css" type="text/css" rel="stylesheet">
        <script type="module" src="game.js" defer></script>
    </head>
    <body>
        <nav></nav>

        <div class="image-panel">
            <img id="display-image" src="images/placeholder.jpg" alt="Room Image">
        </div>
        
        <audio autoplay loop>
            <source src="Audio/StasisProtocolBgMusic.mp3" type="audio/mp3">
        </audio>

        <div class="console-panel" id="console"></div>

        <div class="inventory">
            <div class="inventory-slot" id="slot1"></div>
            <div class="inventory-slot" id="slot2"></div>
            <div class="inventory-slot" id="slot3"></div>
            <div class="inventory-slot" id="slot4"></div>
        </div>

        <div class="player-icon-panel">
            <img id="player-icon" src="images/icon_Player.png" alt="Player Icon">
        </div>

        <div class="room-panel" id="room-display">
            Room: Unknown
        </div>

        <div class="map-panel">
            <img id="map" src="images/map.png" alt="Map">
        </div>

        <div id="results"></div>

        <div class="ai-companion-panel">
            <img id="ai-companion" src="images/CortanaGIF.gif" alt="AI Companion">
        </div>

        <div class="keycard-item-panel">
            <img id="keycard-item" src="images/item_Keycard.png" alt="Keycard">
        </div>

        <div class="wrench-item-panel">
            <img id="wrench-item" src="images/item_Wrench.png" alt="Wrench">
        </div>

        <div class="gun-item-panel">
            <img id="gun-item" src="images/item_Gun.png" alt="Gun">
        </div>

        <div class="bezel-overlay"></div>

        <!-- Escape Menu Overlay -->
        <div id="escapeMenu" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 1000;">
            <button id="returnButton">Return to Game</button>
            <button id="exitButton">Exit Game</button>
        </div>

        <div id="settings-panel">
            <div class="menu-content">
                <h2>Settings</h2>
                <button id="toggle-font-size-button">Toggle Font Size</button>
                <button id="toggle-music-button">Music</button>
            </div>
        </div>
        <button id="settings-button"></button>
    </body>
</html>
