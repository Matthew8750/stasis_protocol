<!DOCTYPE html>
<html>
<head>
    <title>Global Statistics</title>
    <link href="sp-styles.css" type="text/css" rel="stylesheet">
</head>
<body>
    <h1 class="stats-heading"><span>Global Statistics</span></h1>

    <div id="stats" class="stats-box">
        <p>Loading statistics...</p>
    </div>
    <nav> 
        <a href="sp-mainmenu.html" class="back-to-menu">Back to Main Menu</a>  
    </nav>


    <div class="bezel-overlay"></div>

    <script>
       async function fetchGlobalStats() {
            let query = `SELECT deaths, rooms_explored, TIME_TO_SEC(time_played) AS time_played FROM game_stats`;

            let formData = new FormData();
            formData.append('hostname', 'localhost');
            formData.append('username', 'jrice27');
            formData.append('password', 'rZk8FVrXNllcPl8Y');
            formData.append('database', 'CSC1034_CW_13');
            formData.append('query', query);

            try {
                let response = await fetch('https://jrice27.webhosting1.eeecs.qub.ac.uk/dbConnector.php', {
                    method: 'POST',
                    body: formData
                });

                let data = await response.json();

                console.log("Fetched Data: ", data);

                if (data.error || !data.data || data.data.length === 0) {
                    document.getElementById("stats").innerHTML = `<p style="color: red;">Error fetching data or no data returned.</p>`;
                    return;
                }

                let totalDeaths = 0;
                let totalRoomsExplored = 0;
                let totalTimePlayed = 0;
                let playerCount = data.data.length;

                // Calculate totals
                data.data.forEach(player => {
                    totalDeaths += parseInt(player.deaths, 10);
                    totalRoomsExplored += parseInt(player.rooms_explored, 10);
                    totalTimePlayed += parseInt(player.time_played, 10);
                });

                // Calculate averages
                const avgDeaths = totalDeaths / playerCount;
                const avgRoomsExplored = totalRoomsExplored / playerCount;
                const avgTimePlayed = totalTimePlayed / playerCount / 3600; // Convert seconds to hours

                // Display averages in stats div
                let statsDiv = document.getElementById("stats");

                statsDiv.innerHTML = `
                    <p><strong>Average Time Played:</strong> ${avgTimePlayed.toFixed(2)} hours</p>
                    <p><strong>Average Rooms Explored:</strong> ${avgRoomsExplored.toFixed(2)}</p>
                    <p><strong>Average Deaths:</strong> ${avgDeaths.toFixed(2)}</p>
                `;
            } catch (error) {
                document.getElementById("stats").innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            }
        }

        // Fetch stats on page load
        fetchGlobalStats();
    </script>
</body>
</html>
