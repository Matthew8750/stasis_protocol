<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create New Save</title>
        <link href="sp-styles.css" type="text/css" rel="stylesheet">
    </head>
    <body>

        <!-- Save Slot Form -->
        <div class="save-slot">
            <nav><h1>Create a New Player Save</h1></nav>

            <input type="text" id="username" placeholder="Enter Username">
            <input type="password" id="password" placeholder="Enter Password">
            <input type="password" id="confirm_password" placeholder="Confirm Password"> <!-- Password confirmation field -->

                <div class="show-password" id="show_password">
                    <img src="images/showPasswordImage.png" alt="Show Password" id="eye_icon">
                </div> <!-- Eye icon to toggle password visibility -->
                <nav class="button-nav">
                    <a href="#" onclick="savePlayer()" id="save_button">Save</a>
                    <a href="sp_menu.html" id="back_button">Back to Main Menu</a>
                </nav>
        </div>

        <!-- Results Section for feedback -->
        <div id="results_new_player"></div>

        <script>

            document.addEventListener("keydown", function(event) {
                 if (event.key === "Enter") {
                    savePlayer();
                }
            });
            // Toggle password visibility and switch eye icon images on click
            document.getElementById('show_password').addEventListener('click', function() {
                const passwordField = document.getElementById('password');
                const confirmPasswordField = document.getElementById('confirm_password');
                const eyeIcon = document.getElementById('eye_icon');
                
                // Toggle visibility of password fields
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    confirmPasswordField.type = 'text';
                    // Switch the image to 'hidePassword.png'
                    eyeIcon.src = 'images/hidePasswordImage.png';
                } else {
                    passwordField.type = 'password';
                    confirmPasswordField.type = 'password';
                    // Switch the image to 'showPassword.png'
                    eyeIcon.src = 'images/showPasswordImage.png';
                }
            });

            // Function to save player details and perform validation
            async function savePlayer() {
                const playerName = document.getElementById('username').value.trim();
                const playerPassword = document.getElementById('password').value.trim();
                const playerConfirmPassword = document.getElementById('confirm_password').value.trim();
                const resultsDiv = document.getElementById('results_new_player');
                resultsDiv.innerHTML = ''; // Clear previous results
                
                // Validation checks
                if (!playerName) {
                    resultsDiv.innerHTML = '<p style="color:red;">Enter a username.</p>';
                    return;
                }
                if (playerPassword.length < 6) {
                    resultsDiv.innerHTML = '<p style="color:red;">Password must be at least 6 characters.</p>';
                    return;
                }
                if (playerPassword !== playerConfirmPassword) {
                    resultsDiv.innerHTML = '<p style="color:red;">Passwords do not match. Please try again.</p>';
                    return;
                }

                // Check if the username is taken
                const checkData = new FormData();
                checkData.append('hostname', 'localhost');
                checkData.append('username', 'jrice27');
                checkData.append('password', 'rZk8FVrXNllcPl8Y');
                checkData.append('database', 'CSC1034_CW_13');
                checkData.append('query', `SELECT COUNT(*) AS count FROM player WHERE player_name = '${playerName}'`);

                let checkResponse = await fetch('https://jrice27.webhosting1.eeecs.qub.ac.uk/dbConnector.php', { method: 'POST', body: checkData });
                let checkResult = await checkResponse.json();

                if (checkResult.data[0].count > 0) {
                    resultsDiv.innerHTML = '<p style="color:red;">Username taken. Try another.</p>';
                    return;
                }

                // Hash the password
                const hashedPassword = await hashPassword(playerPassword);

                // Insert new user into the database
                const insertData = new FormData();
                insertData.append('hostname', 'localhost');
                insertData.append('username', 'jrice27');
                insertData.append('password', 'rZk8FVrXNllcPl8Y');
                insertData.append('database', 'CSC1034_CW_13');
                insertData.append('query', `INSERT INTO player (player_name, player_password) VALUES ('${playerName}', '${hashedPassword}')`);

                let insertResponse = await fetch('https://jrice27.webhosting1.eeecs.qub.ac.uk/dbConnector.php', { method: 'POST', body: insertData });
                let insertResult = await insertResponse.json();

                if (insertResult.error) {
                    resultsDiv.innerHTML = `<p style="color:red;">${insertResult.error}</p>`;
                } else {
                    resultsDiv.innerHTML = '<p style="color:green;">Account created successfully.</p>';
                    sessionStorage.setItem('loggedInUser', playerName);
                    window.location.href = 'sp_play.html';
                }
            }

            // Function to hash password using SHA-256
            async function hashPassword(password) {
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hashBuffer))
                    .map(byte => byte.toString(16).padStart(2, '0'))
                    .join('');
            }
        </script>

        <!-- Bezel Overlay for visual effect -->
        <div class="bezel-overlay"></div>
        
    </body>
</html>
