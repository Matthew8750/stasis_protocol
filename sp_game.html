<!DOCTYPE html>
<html> 
    <head>
        <title>Stasis Protocol</title>
        <link href="sp_style.css" type="text/css" rel="stylesheet">
    </head>
    <body>
        <nav></nav>

        <div class="image-panel">
            <img id="display-image" src="defaultImage.jpg" alt="Display">
        </div>

        <div class="console-panel" id="console">
            [System]: Console initialized...
        </div>

        <div class="inventory">
            <div class="inventory-slot" id="slot1"></div>
            <div class="inventory-slot" id="slot2"></div>
            <div class="inventory-slot" id="slot3"></div>
            <div class="inventory-slot" id="slot4"></div>
        </div>

        <div class="player-icon-panel">
            [PLAYER]
        </div>

        <div class="room-panel" id="room-display">
            Room: Unknown
        </div>

        <div class="map-panel">
            [MAP]
        </div>

        <div class="ai-companion-panel">
            <img id="ai-companion" src="images/CortanaImage.png" alt="AI Companion">
        </div>

        <div class="bezel-overlay"></div>

        <script>
            function changeImage(newSrc) {
                document.getElementById("display-image").src = newSrc;
            }

            function logToConsole(message) {
                const consolePanel = document.getElementById("console");
                consolePanel.innerHTML += "<br>" + message;
                consolePanel.scrollTop = consolePanel.scrollHeight;
            }

            function updateAIImage(newSrc) {
                document.getElementById("ai-companion").src = newSrc;
            }

            function updateRoom(roomName) {
                document.getElementById("room-display").textContent = "Room: " + roomName;
            }
        </script>
    </body>
</html>
