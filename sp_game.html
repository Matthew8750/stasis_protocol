<!DOCTYPE html>
<html> 
    <head>
        <title>Stasis Protocol</title>
        <link href="sp_style.css" type="text/css" rel="stylesheet">
        <script src="game.js" defer></script>
    </head>
    <body onload="initializeGame()">
        <nav></nav>

        <div class="image-panel">
        <img id="display-image" src="images\CryogenicChamberRoom.jpg" alt="Display">
        </div>

        <div class="console-panel" id="console"></div>

        <div class="inventory">
            <div class="inventory-slot" id="slot1"></div>
            <div class="inventory-slot" id="slot2"></div>
            <div class="inventory-slot" id="slot3"></div>
            <div class="inventory-slot" id="slot4"></div>
        </div>

        <div class="player-icon-panel">
            <img id="player-icon" src="images\icon_Player.png" alt="Player Icon">
        </div>

        <div class="room-panel" id="room-display">
            Room: Unknown
        </div>

        <div class="map-panel">
            <img id="map" src="images\map.png" alt="Map">
        </div>

        <div class="ai-companion-panel">
            <img id="ai-companion" src="images/CortanaGIF.gif" alt="AI Companion">
        </div>

        <div class="bezel-overlay"></div>
    </body>
</html>
