<!DOCTYPE html>
<html>
    <head>
        <title>Stasis Protocol Player Save</title>
        <link href="sp_style.css" type="text/css" rel="stylesheet">
    </head>
    <body>
        <div class="save-slot">
            <nav>Create a New Player Save</nav>
            <input type="text" id="username" placeholder="Enter Username">
            <input type="text" id="password" placeholder="Enter Password">
            <nav><a href="#" onclick="savePlayer()">Save</a></nav>
        </div>
        <nav>
            <a href="sp_menu.html">Back to Main Menu</a>
        </nav>

        <!-- Add a div to display the results -->
        <div id="results"></div>

        <script>
            async function savePlayer() {
                const player_name = document.getElementById('username').value.trim();
                const player_password = document.getElementById('password').value.trim();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';
        
                if (!player_name) {
                    resultsDiv.innerHTML = '<p style="color:red;">Please enter a username.</p>';
                    return;
                }
                if (!player_password) {
                    resultsDiv.innerHTML = '<p style="color:red;">Please enter a password.</p>';
                    return;
                }
        
                let formDataCheck = new FormData();
                formDataCheck.append('hostname', 'localhost');
                formDataCheck.append('username', 'jrice27');
                formDataCheck.append('password', 'rZk8FVrXNllcPl8Y');
                formDataCheck.append('database', 'CSC1034_CW_13');
                formDataCheck.append('query', `SELECT COUNT(*) AS count FROM player WHERE player_name = '${player_name}'`);
        
                try {
                    // Check if username already exists
                    let responseCheck = await fetch('https://jrice27.webhosting1.eeecs.qub.ac.uk/dbConnector.php', {
                        method: 'POST',
                        body: formDataCheck
                    });
        
                    let resultCheck = await responseCheck.json();
        
                    if (resultCheck.data[0].count > 0) {
                        resultsDiv.innerHTML = `<p style="color:red;">Username already taken. Please choose another.</p>`;
                        return;
                    }
        
                    // If username is unique, create the player
                    let formDataInsert = new FormData();
                    formDataInsert.append('hostname', 'localhost');
                    formDataInsert.append('username', 'jrice27');
                    formDataInsert.append('password', 'rZk8FVrXNllcPl8Y');
                    formDataInsert.append('database', 'CSC1034_CW_13');
                    formDataInsert.append('query', `INSERT INTO player (player_name, player_password) VALUES ('${player_name}', '${player_password}')`);
        
                    let responseInsert = await fetch('https://jrice27.webhosting1.eeecs.qub.ac.uk/dbConnector.php', {
                        method: 'POST',
                        body: formDataInsert
                    });
        
                    let resultInsert = await responseInsert.json();
        
                    if (resultInsert.error) {
                        resultsDiv.innerHTML = `<p style="color:red;">${resultInsert.error}</p>`;
                    } else {
                        resultsDiv.innerHTML = `<p style="color:green;">Account created successfully.</p>`;
                        sessionStorage.setItem('loggedInUser', player_name); // Log in automatically
                        window.location.href = 'sp_play.html'; // Redirect to play page
                    }
                } catch (error) {
                    console.error('Error:', error);
                    resultsDiv.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
                }
            }
        </script>
        
        <div class="bezel-overlay"></div>
    </body>
</html>
